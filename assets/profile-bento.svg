<svg viewBox="0 0 860 432" width="100%" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <style>
      .font-sans { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Inter, Roboto, Helvetica, Arial, sans-serif; }
      .font-mono { font-family: 'JetBrains Mono', 'Fira Code', 'SFMono-Regular', Consolas, 'Liberation Mono', Menlo, monospace; }

      @keyframes pulseAmbient {
        0%, 100% { opacity: 0.55; }
        50% { opacity: 0.95; }
      }
      @keyframes blink {
        0%, 48% { opacity: 1; }
        52%, 100% { opacity: 0.15; }
      }
      @keyframes eqBar1 {
        0%, 100% { transform: scaleY(0.45); }
        50% { transform: scaleY(1); }
      }
      @keyframes eqBar2 {
        0%, 100% { transform: scaleY(0.95); }
        45% { transform: scaleY(0.35); }
      }
      @keyframes eqBar3 {
        0%, 100% { transform: scaleY(0.6); }
        60% { transform: scaleY(1); }
      }
      @keyframes eqBar4 {
        0%, 100% { transform: scaleY(1); }
        35% { transform: scaleY(0.4); }
      }

      .ambient-glow { animation: pulseAmbient 4.5s ease-in-out infinite; }
      .cursor-blink { animation: blink 1.15s infinite; }
      .eq { transform-box: fill-box; transform-origin: bottom; }
      .eq-1 { animation: eqBar1 1.3s ease-in-out infinite; }
      .eq-2 { animation: eqBar2 1.05s ease-in-out infinite; }
      .eq-3 { animation: eqBar3 1.5s ease-in-out infinite; }
      .eq-4 { animation: eqBar4 1.2s ease-in-out infinite; }
    </style>

    <pattern id="darkGrid" width="28" height="28" patternUnits="userSpaceOnUse">
      <path d="M 28 0 L 0 0 0 28" fill="none" stroke="#ffffff" stroke-width="0.6" stroke-opacity="0.035"/>
    </pattern>

    <linearGradient id="cardBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#12161f"/>
      <stop offset="100%" stop-color="#0a0d12"/>
    </linearGradient>

    <linearGradient id="topAccent" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#e11d48"/>
      <stop offset="45%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#12161f" stop-opacity="0"/>
    </linearGradient>

    <radialGradient id="heroGlow" cx="85%" cy="28%" r="55%">
      <stop offset="0%" stop-color="#e11d48" stop-opacity="0.24"/>
      <stop offset="45%" stop-color="#ffffff" stop-opacity="0.05"/>
      <stop offset="100%" stop-color="#0a0d12" stop-opacity="0"/>
    </radialGradient>

    <filter id="crossGlow" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="3.5" result="blur1"/>
      <feMerge>
        <feMergeNode in="blur1"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- ================= HERO BANNER CARD (TOP) ================= -->
  <g>
    <rect x="4" y="4" width="852" height="162" rx="14" fill="url(#cardBg)" stroke="#21262d" stroke-width="1.2"/>
    <rect x="4" y="4" width="852" height="162" rx="14" fill="url(#darkGrid)"/>
    <rect x="4" y="4" width="852" height="162" rx="14" fill="url(#heroGlow)" class="ambient-glow"/>

    <!-- Top Accent Line -->
    <rect x="28" y="4" width="280" height="2" fill="url(#topAccent)"/>

    <!-- Terminal Header Bar -->
    <circle cx="28" cy="28" r="4" fill="#262c36"/>
    <circle cx="42" cy="28" r="4" fill="#262c36"/>
    <circle cx="56" cy="28" r="4" fill="#262c36"/>
    <text x="72" y="32" fill="#6e7681" font-size="11" class="font-mono">betta-core // root@arch</text>

    <!-- Live Status Pill -->
    <rect x="682" y="16" width="154" height="24" rx="12" fill="#161b22" stroke="#262c36" stroke-width="1"/>
    <circle cx="698" cy="28" r="4" fill="#f43f5e" class="cursor-blink"/>
    <text x="710" y="32" fill="#c9d1d9" font-size="10.5" font-weight="600" letter-spacing="0.8" class="font-mono">HIGH-UPTIME • LIVE</text>

    <!-- Main Title + Glowing Cross -->
    <text x="32" y="88" fill="#ffffff" font-size="42" font-weight="800" letter-spacing="-0.5" class="font-sans">BETTA</text>
    <text x="182" y="87" fill="#ffffff" font-size="38" font-weight="400" filter="url(#crossGlow)" class="font-sans ambient-glow">†</text>

    <!-- Subtitle & Bio -->
    <text x="34" y="116" fill="#fb7185" font-size="12.5" font-weight="700" letter-spacing="1.6" class="font-mono">GAME SYSTEMS &amp; FULL-STACK ARCHITECT</text>
    <text x="34" y="140" fill="#8b949e" font-size="13.5" class="font-sans">Building high-uptime game servers, real-time web backends, and low-latency tooling.</text>
    <rect x="556" y="128" width="7" height="14" fill="#e11d48" class="cursor-blink"/>

    <!-- Subtle Cross Watermark on Right -->
    <g transform="translate(768, 52)" opacity="0.12">
      <rect x="20" y="0" width="6" height="78" rx="2" fill="#ffffff"/>
      <rect x="2" y="20" width="42" height="6" rx="2" fill="#ffffff"/>
    </g>
  </g>

  <!-- ================= MIDDLE ROW: 2 BENTO CARDS ================= -->
  <!-- Left Card: MVP PROJECT -->
  <g>
    <rect x="4" y="178" width="420" height="148" rx="14" fill="url(#cardBg)" stroke="#21262d" stroke-width="1.2"/>
    <text x="26" y="206" fill="#6e7681" font-size="10.5" font-weight="600" letter-spacing="1.2" class="font-mono">01 // FLAGSHIP ECOSYSTEM</text>

    <!-- Animated Telemetry Equalizer -->
    <rect x="372" y="220" width="4" height="24" rx="1.5" fill="#e11d48" class="eq eq-1"/>
    <rect x="380" y="220" width="4" height="24" rx="1.5" fill="#fb7185" class="eq eq-2"/>
    <rect x="388" y="220" width="4" height="24" rx="1.5" fill="#ffffff" class="eq eq-3"/>
    <rect x="396" y="220" width="4" height="24" rx="1.5" fill="#e11d48" class="eq eq-4"/>

    <text x="26" y="236" fill="#ffffff" font-size="20" font-weight="700" class="font-sans">MVP PROJECT</text>
    <rect x="168" y="220" width="80" height="20" rx="5" fill="#161b22" stroke="#30363d" stroke-width="1"/>
    <text x="178" y="234" fill="#c9d1d9" font-size="10.5" font-weight="600" class="font-mono">CS2 MANIAC</text>

    <text x="26" y="264" fill="#8b949e" font-size="12.5" class="font-sans">High-tickrate CS2 server ecosystem &amp; automated web store.</text>
    <text x="26" y="284" fill="#8b949e" font-size="12.5" class="font-sans">Custom CounterStrikeSharp (.NET) plugins, Panorama SVG</text>
    <text x="26" y="304" fill="#8b949e" font-size="12.5" class="font-sans">ranks, live WebSocket telemetry &amp; instant payment hooks.</text>
  </g>

  <!-- Right Card: ENGINEERING DOMAINS -->
  <g>
    <rect x="436" y="178" width="420" height="148" rx="14" fill="url(#cardBg)" stroke="#21262d" stroke-width="1.2"/>
    <text x="458" y="206" fill="#6e7681" font-size="10.5" font-weight="600" letter-spacing="1.2" class="font-mono">02 // ENGINEERING DOMAINS</text>

    <!-- Row 1 -->
    <rect x="458" y="220" width="376" height="28" rx="6" fill="#141922" stroke="#21262d" stroke-width="1"/>
    <circle cx="472" cy="234" r="3.5" fill="#e11d48"/>
    <text x="484" y="238" fill="#e6edf3" font-size="12" font-weight="600" class="font-sans">Game Server Mechanics &amp; Plugins</text>
    <text x="728" y="238" fill="#6e7681" font-size="11" class="font-mono">C# • CSSharp</text>

    <!-- Row 2 -->
    <rect x="458" y="254" width="376" height="28" rx="6" fill="#141922" stroke="#21262d" stroke-width="1"/>
    <circle cx="472" cy="268" r="3.5" fill="#ffffff"/>
    <text x="484" y="272" fill="#e6edf3" font-size="12" font-weight="600" class="font-sans">Realtime Telemetry &amp; Steam Auth</text>
    <text x="722" y="272" fill="#6e7681" font-size="11" class="font-mono">WS • Steam API</text>

    <!-- Row 3 -->
    <rect x="458" y="288" width="376" height="28" rx="6" fill="#141922" stroke="#21262d" stroke-width="1"/>
    <circle cx="472" cy="302" r="3.5" fill="#e11d48"/>
    <text x="484" y="306" fill="#e6edf3" font-size="12" font-weight="600" class="font-sans">Payment Gateways, Bots &amp; Linux VPS</text>
    <text x="718" y="306" fill="#6e7681" font-size="11" class="font-mono">Node • Python</text>
  </g>

  <!-- ================= BOTTOM CARD: CORE STACK ================= -->
  <g>
    <rect x="4" y="338" width="852" height="88" rx="14" fill="url(#cardBg)" stroke="#21262d" stroke-width="1.2"/>
    <text x="26" y="364" fill="#6e7681" font-size="10.5" font-weight="600" letter-spacing="1.2" class="font-mono">03 // CORE STACK &amp; INFRASTRUCTURE</text>

    <g transform="translate(26, 378)" class="font-mono" font-size="11.5" font-weight="600">
      <rect x="0" y="0" width="84" height="30" rx="7" fill="#161b22" stroke="#30363d"/>
      <text x="42" y="19" fill="#ffffff" text-anchor="middle">C# / .NET</text>

      <rect x="94" y="0" width="154" height="30" rx="7" fill="#161b22" stroke="#30363d"/>
      <text x="171" y="19" fill="#ffffff" text-anchor="middle">CounterStrikeSharp</text>

      <rect x="258" y="0" width="82" height="30" rx="7" fill="#161b22" stroke="#30363d"/>
      <text x="299" y="19" fill="#e6edf3" text-anchor="middle">Node.js</text>

      <rect x="350" y="0" width="78" height="30" rx="7" fill="#161b22" stroke="#30363d"/>
      <text x="389" y="19" fill="#e6edf3" text-anchor="middle">Python</text>

      <rect x="438" y="0" width="74" height="30" rx="7" fill="#161b22" stroke="#30363d"/>
      <text x="475" y="19" fill="#e6edf3" text-anchor="middle">MySQL</text>

      <rect x="522" y="0" width="92" height="30" rx="7" fill="#161b22" stroke="#30363d"/>
      <text x="568" y="19" fill="#e6edf3" text-anchor="middle">Linux VPS</text>

      <rect x="624" y="0" width="94" height="30" rx="7" fill="#161b22" stroke="#30363d"/>
      <text x="671" y="19" fill="#e6edf3" text-anchor="middle">Steam API</text>

      <rect x="728" y="0" width="80" height="30" rx="7" fill="#161b22" stroke="#30363d"/>
      <text x="768" y="19" fill="#e6edf3" text-anchor="middle">Luau</text>
    </g>
  </g>
</svg>
